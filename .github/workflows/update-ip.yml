
name: Update VPN IP Lists

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0,12 * * *"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate IP addresses
        run: python main.py

      - name: Validate output
        shell: bash
        run: |
          test -s domain-ip-resolve.rsc
          grep -q '/ip/firewall/address-list add' domain-ip-resolve.rsc
          wc -l domain-ip-resolve.rsc

      - name: Save generated list
        uses: actions/upload-artifact@v4
        with:
          name: vpn-ip-list
          path: domain-ip-resolve.rsc
          retention-days: 7
          if-no-files-found: error
